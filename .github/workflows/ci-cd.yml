name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build and Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8

      - name: Lint application
        run: |
          flake8 app tests --max-line-length=100

      - name: Run automated tests
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=term-missing

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t northwind-logistics:latest .

  deploy:
    name: Validate Kubernetes Deployment
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Validate Kubernetes manifests
        run: |
          kubectl create --dry-run=client -f k8s/deployment.yaml
          kubectl create --dry-run=client -f k8s/service.yaml