name: CI-CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  COVERAGE_THRESHOLD: "90"

  LOCAL_IMAGE_NAME: northwind-logistics:1.0.0
  KIND_CLUSTER_NAME: northwind-ci

jobs:
  quality:
    name: Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev-lock.txt

      - name: Lint application and tests
        run: |
          flake8 app tests --max-line-length=100

      - name: Run Bandit security analysis
        run: |
          python -m bandit -r app -ll

      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements-dev-lock.txt

      - name: Run automated tests with coverage gate
        run: |
          python -m pytest \
            --cov=app \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${COVERAGE_THRESHOLD}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  container:
    name: Build and Smoke Test Container
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag "${LOCAL_IMAGE_NAME}" \
            .

      - name: Start container
        run: |
          docker run \
            --detach \
            --name northwind-ci \
            --publish 8000:8000 \
            "${LOCAL_IMAGE_NAME}"

      - name: Wait for healthy container
        run: |
          for attempt in {1..30}; do
            status="$(docker inspect \
              --format='{{.State.Health.Status}}' \
              northwind-ci 2>/dev/null || true)"

            echo "Attempt ${attempt}: container status=${status}"

            if [ "${status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${status}" = "unhealthy" ]; then
              docker logs northwind-ci
              exit 1
            fi

            sleep 2
          done

          echo "Container did not become healthy in time."
          docker logs northwind-ci
          exit 1

      - name: Verify application health endpoint
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            http://127.0.0.1:8000/health

      - name: Verify non-root container user
        run: |
          user_details="$(docker exec northwind-ci id)"
          echo "${user_details}"
          echo "${user_details}" | grep "uid=10001(appuser)"

      - name: Show container logs
        if: always()
        run: |
          docker logs northwind-ci || true

      - name: Remove test container
        if: always()
        run: |
          docker rm --force northwind-ci || true

  kubernetes:
    name: Deploy and Verify Kubernetes
    runs-on: ubuntu-latest
    needs: container

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl --fail --location --output kind \
            https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64

          chmod +x kind
          sudo mv kind /usr/local/bin/kind

          kind version

      - name: Create temporary Kubernetes cluster
        run: |
          kind create cluster \
            --name "${KIND_CLUSTER_NAME}" \
            --wait 120s

          kubectl cluster-info \
            --context "kind-${KIND_CLUSTER_NAME}"

          kubectl get nodes

      - name: Build deployment image
        run: |
          docker build \
            --tag "${LOCAL_IMAGE_NAME}" \
            .

      - name: Load image into kind
        run: |
          kind load docker-image \
            "${LOCAL_IMAGE_NAME}" \
            --name "${KIND_CLUSTER_NAME}"

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
            --dry-run=client \
            --filename k8s/deployment.yaml

          kubectl apply \
            --dry-run=client \
            --filename k8s/service.yaml

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply --filename k8s/deployment.yaml
          kubectl apply --filename k8s/service.yaml

      - name: Wait for Kubernetes rollout
        run: |
          kubectl rollout status \
            deployment/northwind-logistics \
            --timeout=180s

      - name: Verify Kubernetes resources
        run: |
          kubectl get deployments
          kubectl get pods --output=wide
          kubectl get services

          kubectl wait \
            --for=condition=Ready \
            pod \
            --selector=app=northwind-logistics \
            --timeout=120s

          ready_replicas="$(kubectl get deployment northwind-logistics \
            --output=jsonpath='{.status.readyReplicas}')"

          echo "Ready replicas: ${ready_replicas}"
          test "${ready_replicas}" = "2"

      - name: Verify deployed image
        run: |
          deployed_image="$(kubectl get deployment northwind-logistics \
            --output=jsonpath='{.spec.template.spec.containers[0].image}')"

          echo "Deployed image: ${deployed_image}"
          test "${deployed_image}" = "${LOCAL_IMAGE_NAME}"

      - name: Verify non-root Kubernetes container
        run: |
          pod_name="$(kubectl get pods \
            --selector=app=northwind-logistics \
            --output=jsonpath='{.items[0].metadata.name}')"

          echo "Testing pod: ${pod_name}"

          user_details="$(kubectl exec "${pod_name}" -- id)"
          echo "${user_details}"
          echo "${user_details}" | grep "uid=10001(appuser)"

      - name: Verify Kubernetes health endpoint
        run: |
          kubectl port-forward \
            service/northwind-logistics-service \
            18000:8000 \
            > port-forward.log 2>&1 &

          port_forward_pid=$!

          cleanup() {
            kill "${port_forward_pid}" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in {1..30}; do
            if response="$(curl \
              --fail \
              --show-error \
              --silent \
              http://127.0.0.1:18000/health)"; then

              echo "Health response: ${response}"
              echo "${response}" | grep '"status": "ok"'
              exit 0
            fi

            echo "Waiting for port-forward: attempt ${attempt}"
            sleep 2
          done

          echo "Kubernetes health check failed."
          cat port-forward.log
          exit 1

      - name: Show Kubernetes diagnostics
        if: always()
        run: |
          kubectl get all || true
          kubectl describe deployment northwind-logistics || true
          kubectl get events \
            --sort-by=.metadata.creationTimestamp || true

          for pod in $(kubectl get pods \
            --selector=app=northwind-logistics \
            --output=name 2>/dev/null); do
            kubectl logs "${pod}" || true
          done

      - name: Delete temporary cluster
        if: always()
        run: |
          kind delete cluster \
            --name "${KIND_CLUSTER_NAME}"

  publish:
    name: Publish Image to GHCR
    runs-on: ubuntu-latest
    needs:
      - quality
      - container
      - kubernetes

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate lowercase image name
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" \
            | tr '[:upper:]' '[:lower:]')"

          echo "GHCR_IMAGE=ghcr.io/${owner}/northwind-logistics" \
            >> "${GITHUB_ENV}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Northwind Logistics
            org.opencontainers.image.description=Northwind delivery tracking service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}